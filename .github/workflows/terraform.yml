name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
  push:
    paths:
      - "terraform/**"
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Type 'apply' to allow Terraform apply"
        required: false
        default: ""

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Validate Terraform CI configuration
        env:
          TF_VAR_location: ${{ secrets.TF_VAR_LOCATION }}
          TF_VAR_project: ${{ secrets.TF_VAR_PROJECT }}
          TF_VAR_environment: ${{ secrets.TF_VAR_ENVIRONMENT }}
        run: |
          set -euo pipefail

          if [[ -z "${TF_VAR_location}" ]]; then
            echo "::error::Missing secret: TF_VAR_LOCATION"
            exit 1
          fi

          if [[ -z "${TF_VAR_project}" ]]; then
            echo "::error::Missing secret: TF_VAR_PROJECT"
            exit 1
          fi

          if [[ -z "${TF_VAR_environment}" ]]; then
            echo "::error::Missing secret: TF_VAR_ENVIRONMENT"
            exit 1
          fi

          echo "Terraform CI target:"
          echo "  location=${TF_VAR_location}"
          echo "  project=${TF_VAR_project}"
          echo "  environment=${TF_VAR_environment}"

      - name: Terraform init
        working-directory: terraform
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=aiarchitect.tfstate"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: terraform
        env:
          TF_VAR_subscription_id: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}
          TF_VAR_location: ${{ secrets.TF_VAR_LOCATION }}
          TF_VAR_project: ${{ secrets.TF_VAR_PROJECT }}
          TF_VAR_environment: ${{ secrets.TF_VAR_ENVIRONMENT }}
          TF_VAR_deployer_object_id: ${{ secrets.TF_VAR_DEPLOYER_OBJECT_ID }}
          TF_VAR_openai_api_key: ${{ secrets.TF_VAR_OPENAI_API_KEY }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
        run: terraform plan -out=tfplan -no-color

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_apply == 'apply'
    environment: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Validate Terraform CI configuration
        env:
          TF_VAR_location: ${{ secrets.TF_VAR_LOCATION }}
          TF_VAR_project: ${{ secrets.TF_VAR_PROJECT }}
          TF_VAR_environment: ${{ secrets.TF_VAR_ENVIRONMENT }}
        run: |
          set -euo pipefail

          if [[ -z "${TF_VAR_location}" ]]; then
            echo "::error::Missing secret: TF_VAR_LOCATION"
            exit 1
          fi

          if [[ -z "${TF_VAR_project}" ]]; then
            echo "::error::Missing secret: TF_VAR_PROJECT"
            exit 1
          fi

          if [[ -z "${TF_VAR_environment}" ]]; then
            echo "::error::Missing secret: TF_VAR_ENVIRONMENT"
            exit 1
          fi

          echo "Terraform CI target:"
          echo "  location=${TF_VAR_location}"
          echo "  project=${TF_VAR_project}"
          echo "  environment=${TF_VAR_environment}"

      - name: Terraform init
        working-directory: terraform
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=aiarchitect.tfstate"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_subscription_id: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}
          TF_VAR_location: ${{ secrets.TF_VAR_LOCATION }}
          TF_VAR_project: ${{ secrets.TF_VAR_PROJECT }}
          TF_VAR_environment: ${{ secrets.TF_VAR_ENVIRONMENT }}
          TF_VAR_deployer_object_id: ${{ secrets.TF_VAR_DEPLOYER_OBJECT_ID }}
          TF_VAR_openai_api_key: ${{ secrets.TF_VAR_OPENAI_API_KEY }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
        run: terraform apply tfplan
