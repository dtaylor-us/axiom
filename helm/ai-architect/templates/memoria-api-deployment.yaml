apiVersion: apps/v1
kind: Deployment
metadata:
  name: memoria-api
  labels:
    {{- include "ai-architect.labels" . | nindent 4 }}
    app.kubernetes.io/component: memoria-api
spec:
  replicas: {{ .Values.memoriaApi.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: memoria-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: memoria-api
        app: memoria-api
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: memoria-api
          image: {{ include "ai-architect.image" (dict "global" .Values.global "image" .Values.memoriaApi.image) }}
          imagePullPolicy: {{ .Values.memoriaApi.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.memoriaApi.service.port }}
              protocol: TCP
          env:
            - name: MEMORIA_API_PORT
              value: "8084"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: POSTGRES_URL
              value: "jdbc:postgresql://{{ .Values.database.host }}:5432/memoria?sslmode=require"
            - name: POSTGRES_USERNAME
              value: "axiom"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: archon-secrets
                  key: db-password
            - name: MEMORIA_AGENT_BASE_URL
              value: "http://memoria-agent:8087"
            - name: AXIOM_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: archon-secrets
                  key: internal-secret
            # Pillar API base URLs for cross-pillar session payload fetching
            - name: ARCHON_API_BASE_URL
              value: "http://ai-architect-api:8081"
            - name: SPECWEAVER_API_BASE_URL
              value: "http://specweaver-api:8082"
            - name: LENS_API_BASE_URL
              value: "http://lens-api:8083"
            # Disable OTEL SDK when no endpoint is configured.
            # An empty endpoint causes Spring Boot to construct "/v1/traces"
            # which is an invalid relative URL and crashes the application.
            - name: OTEL_SDK_DISABLED
              value: "true"
            - name: MANAGEMENT_TRACING_ENABLED
              value: "false"
          resources:
            {{- toYaml .Values.memoriaApi.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.memoriaApi.service.port }}
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.memoriaApi.service.port }}
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          {{- if .Values.keyVault.enabled }}
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
          {{- end }}
      {{- if .Values.keyVault.enabled }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-secrets
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: memoria-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: memoria-api
    chart: {{ .Chart.Name }}
    release: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: memoria-api
  ports:
    - name: http
      port: {{ .Values.memoriaApi.service.port }}
      targetPort: {{ .Values.memoriaApi.service.port }}
      protocol: TCP
